<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#1a6dff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#0a3a9e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#4fd8ff"/>
      <stop offset="1" stop-color="#1a6dff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d63"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1a6dff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <ellipse cx="330" cy="290" rx="300" ry="200" fill="url(#glow)"/>

  <!-- arco de "planeta" -->
  <path d="M10 430 Q 300 170 640 120" stroke="url(#arc)" stroke-width="6" filter="url(#blur)"/>
  <path d="M10 430 Q 300 170 640 120" stroke="url(#arc)" stroke-width="1.6"/>

  <!-- partículas / rede neural -->
  <g fill="#4fd8ff">
    <circle cx="560" cy="70" r="2"/><circle cx="600" cy="160" r="1.5"/><circle cx="520" cy="40" r="1.2"/>
    <circle cx="90" cy="120" r="1.5"/><circle cx="140" cy="60" r="1.2"/><circle cx="60" cy="250" r="1.4"/>
    <circle cx="610" cy="300" r="1.3"/><circle cx="480" cy="110" r="1.6"/>
  </g>
  <g stroke="#1a6dff" stroke-opacity=".45" stroke-width="1">
    <path d="M520 40 L560 70 L600 160 M560 70 L480 110"/>
    <path d="M140 60 L90 120 L60 250"/>
  </g>

  <!-- órbitas -->
  <ellipse cx="330" cy="300" rx="270" ry="70" stroke="#1a6dff" stroke-opacity=".55" stroke-width="1.5" transform="rotate(-6 330 300)"/>
  <ellipse cx="330" cy="300" rx="270" ry="70" stroke="#4fd8ff" stroke-width="3" stroke-opacity=".25" filter="url(#soft)" transform="rotate(-6 330 300)"/>

  <!-- tela do notebook -->
  <path d="M392 120 L560 104 L520 330 L360 342 Z" fill="url(#screen)" stroke="#4fd8ff" stroke-width="2.5"/>
  <path d="M392 120 L560 104 L520 330 L360 342 Z" stroke="#4fd8ff" stroke-width="7" stroke-opacity=".35" filter="url(#soft)"/>
  <g stroke="#1a6dff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
    <path d="M400 150 L470 144"/><path d="M406 172 L500 164"/><path d="M398 194 L450 190"/>
    <path d="M394 216 L480 209"/><path d="M390 238 L440 234"/><path d="M386 260 L470 253"/>
  </g>

  <!-- base do notebook -->
  <path d="M150 350 L360 342 L520 330 L560 360 L210 386 Z" fill="url(#base)" stroke="#4fd8ff" stroke-width="2"/>
  <path d="M210 386 L560 360 L558 368 L212 394 Z" fill="#0d1b35" stroke="#4fd8ff" stroke-opacity=".8" stroke-width="1.5"/>
  <path d="M250 360 L470 347 L490 358 L270 373 Z" fill="#0a1428" stroke="#1a6dff" stroke-opacity=".6"/>
  <path d="M220 392 L560 366" stroke="#4fd8ff" stroke-width="8" stroke-opacity=".35" filter="url(#blur)"/>

  <!-- painel holográfico com </> -->
  <g>
    <rect x="200" y="70" width="190" height="170" rx="22" fill="url(#holo)" stroke="#4fd8ff" stroke-width="2.5" transform="rotate(-8 295 155)"/>
    <rect x="200" y="70" width="190" height="170" rx="22" stroke="#4fd8ff" stroke-width="8" stroke-opacity=".3" filter="url(#soft)" transform="rotate(-8 295 155)"/>
    <g transform="rotate(-8 295 155)" stroke="#4fd8ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 122 L230 155 L262 188"/>
      <path d="M328 122 L360 155 L328 188"/>
      <path d="M308 112 L284 198"/>
    </g>
    <g transform="rotate(-8 295 155)" stroke="#aef0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
      <path d="M262 122 L230 155 L262 188"/>
      <path d="M328 122 L360 155 L328 188"/>
      <path d="M308 112 L284 198"/>
    </g>
  </g>

  <!-- chip de IA -->
  <g transform="translate(588 250)">
    <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#06122a" stroke="#4fd8ff" stroke-width="2"/>
    <rect x="-34" y="-34" width="68" height="68" rx="12" stroke="#4fd8ff" stroke-width="6" stroke-opacity=".3" filter="url(#soft)"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#4fd8ff">IA</text>
    <g stroke="#4fd8ff" stroke-width="2.5" stroke-linecap="round">
      <path d="M-18 -34 v-10 M0 -34 v-10 M18 -34 v-10 M-18 34 v10 M0 34 v10 M18 34 v10"/>
      <path d="M-34 -18 h-10 M-34 0 h-10 M-34 18 h-10 M34 -18 h10 M34 0 h10 M34 18 h10"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
